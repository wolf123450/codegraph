<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code·graph</title>
<style>
  :root {
    --bg: #0E1116; --panel: #161B22cc; --line: #232B36;
    --ink: #D6DEE8; --muted: #7D8895; --accent: #45C4B8;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 12px/1.5 var(--mono); overflow: hidden; }
  #graph { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #graph:active { cursor: grabbing; }

  #brand { position: fixed; top: 14px; left: 16px; letter-spacing: .35em;
    font-size: 13px; color: var(--muted); user-select: none; pointer-events: none; }
  #brand b { color: var(--ink); font-weight: 600; }

  #rail { position: fixed; top: 44px; left: 16px; width: 210px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    backdrop-filter: blur(6px); max-height: calc(100vh - 60px); overflow-y: auto; }
  #rail h2 { font-size: 10px; font-weight: 600; letter-spacing: .18em; color: var(--muted);
    text-transform: uppercase; margin: 14px 0 6px; }
  #rail h2:first-child { margin-top: 0; }
  #rail details.section { margin: 0; }
  #rail details.section > summary { list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600;
    letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; }
  #rail details.section:first-child > summary { margin-top: 0; }
  #rail details.section > summary::-webkit-details-marker { display: none; }
  #rail details.section > summary::before { content: "▸"; display: inline-block;
    font-size: 9px; transition: transform .1s; }
  #rail details.section[open] > summary::before { transform: rotate(90deg); }
  label.row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
  label.row input { accent-color: var(--accent); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .edgekey { display: block; width: 22px; height: 6px; flex: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-label { display: flex; justify-content: space-between; color: var(--muted); margin-top: 6px; }
  #loadfile { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #loadfile input { width: 100%; }
  #stats { color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }

  #selection-info { color: var(--muted); margin-bottom: 6px; min-height: 15px; }
  #selection-groups { margin-bottom: 6px; }
  button { font: 12px var(--mono); background: #1B2230; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: default; opacity: .5; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  #new-group-name, #path-input { flex: 1; min-width: 0; background: #1B2230; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: 12px var(--mono); }

  .hidden-row { display: flex; align-items: center; gap: 6px; padding: 2px 0;
    color: var(--muted); }
  .hidden-row .restore-x { cursor: pointer; color: var(--accent); flex: none;
    width: 14px; text-align: center; }
  .hidden-row .hidden-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hidden-empty { color: var(--muted); font-style: italic; }

  .group-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .group-row input[type=checkbox] { margin: 0; accent-color: var(--accent); }
  .group-name { cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .group-name.group-name-selected { text-decoration: underline; font-weight: 600; }
  .group-del { cursor: pointer; color: var(--muted); flex: none; width: 12px; text-align: center; }
  .group-del:hover { color: var(--accent); }
  .group-chip { display: inline-flex; align-items: center; gap: 4px; background: #1B2230;
    border: 1px solid var(--line); border-radius: 10px; padding: 1px 6px; margin: 2px 4px 2px 0;
    font-size: 11px; }
  .group-chip .chip-x { cursor: pointer; color: var(--accent); }

  #tooltip { position: fixed; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 300px;
    opacity: 0; transition: opacity .12s; backdrop-filter: blur(6px); z-index: 10; }
  #tooltip .t-name { font-weight: 600; }
  #tooltip .t-file, #tooltip .t-meta { color: var(--muted); font-size: 11px; }
  #tooltip .t-sig { color: var(--accent); font-size: 11px; }
  #tooltip .t-desc { max-width: 220px; }

</style>
</head>
<body>
<div id="brand"><b>code</b>·graph</div>
<div id="rail">
  <details class="section" open>
    <summary>Edges</summary>
    <div id="edge-toggles"></div>
  </details>
  <details class="section" open>
    <summary>Roles</summary>
    <div id="role-legend"></div>
  </details>
  <details class="section" open>
    <summary>Groups</summary>
    <div id="group-list"></div>
    <div class="btn-row" style="margin-top:6px">
      <input type="text" id="new-group-name" placeholder="new group name">
      <button id="new-group-btn">+</button>
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button id="export-groups">export groups</button>
      <button id="import-groups">import groups</button>
      <input type="file" id="import-groups-file" accept=".json" hidden>
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button id="reset-groups">reset groups to file</button>
    </div>
  </details>
  <h2>Physics</h2>
  <div class="slider-label"><span>repulsion</span><span id="charge-val"></span></div>
  <input type="range" id="charge" min="0.3" max="15" step="0.05" value="1">
  <div class="slider-label"><span>spring length</span><span id="spring-val"></span></div>
  <input type="range" id="spring" min="0.5" max="15" step="0.05" value="1">
  <div class="slider-label"><span>group separation</span><span id="intergroup-val"></span></div>
  <input type="range" id="intergroup" min="0" max="15" step="0.5" value="3">
  <label class="row" style="margin-top:8px"><input type="checkbox" id="hulls" checked> group bubbles</label>
  <label class="row"><input type="checkbox" id="labels" checked> labels</label>
  <h2>Selection</h2>
  <div id="selection-info">click a node or edge to select it</div>
  <div id="selection-groups"></div>
  <div id="selection-charge" style="display:none">
    <div class="slider-label"><span>this node's repulsion offset</span><span id="node-charge-val"></span></div>
    <input type="range" id="node-charge" min="-100" max="100" step="5" value="0">
  </div>
  <div class="btn-row">
    <button id="hide-selected" disabled>hide selected</button>
    <button id="add-to-group" disabled>add to group</button>
  </div>
  <h2>Hidden</h2>
  <div id="hidden-nodes"></div>
  <div id="hidden-edges-count" style="color:var(--muted); margin-top:4px;"></div>
  <div class="btn-row" style="margin-top:6px">
    <button id="restore-all" disabled>restore all</button>
  </div>
  <h2>Data</h2>
  <div id="loadfile">load graph.json (or drop it anywhere)<input type="file" accept=".json"></div>
  <div class="btn-row" style="margin-top:6px">
    <input type="text" id="path-input" placeholder="absolute path to graph.json">
    <button id="path-load-btn">load</button>
  </div>
  <div id="path-error" style="color:#E06C75; font-size:11px; margin-top:4px;"></div>
  <div id="stats"></div>
</div>
<div id="tooltip"></div>
<canvas id="graph"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";

const ROLE_META = {
  manager:   { color: "#E8B04B", desc: "Autoloaded singleton (Godot [autoload])." },
  object:    { color: "#5B9FE3", desc: "Nearest Godot base is Node — a plain gameplay object." },
  ui:        { color: "#C792EA", desc: "Nearest Godot base is Control." },
  data:      { color: "#6FBF73", desc: "Nearest Godot base is Resource — typically inert data." },
  utility:   { color: "#8A93A6", desc: "Static class with no instance state." },
  interface: { color: "#45C4B8", desc: "A C# interface." },
  scene:     { color: "#E06C75", desc: "A .tscn scene file." },
  plain:     { color: "#5A6675", desc: "No stronger heuristic matched; an ordinary C# type." },
};
const EDGE_STYLE = { // stroke, dasharray, base rest-length padding, spring strength
  inherits:    { color: "#B48EAD", dash: null,      pad: 60,  strength: 0.7,  arrow: true,
    desc: "A's base class is B (A extends B)." },
  implements:  { color: "#45C4B8", dash: "6 4",     pad: 70,  strength: 0.5,  arrow: true,
    desc: "A implements interface B." },
  calls:       { color: "#5F6B7A", dash: null,      pad: 40,  strength: 0.35, arrow: true,
    desc: "A invokes a method defined on B. Thicker/more opaque lines mean more call sites." },
  composes:    { color: "#E8B04B", dash: null,      pad: 50,  strength: 0.5,  arrow: true,
    desc: "A holds a field or property of type B (a “has-a” relationship)." },
  signal:      { color: "#E06C75", dash: "2 5",     pad: 90,  strength: 0.15, arrow: true,
    desc: "A listens for a signal declared/emitted by B, via Connect(), a C# event +=, or a Godot .tscn [connection]." },
  sceneAttach: { color: "#4A5568", dash: "1 4",     pad: 55,  strength: 0.4,  arrow: true,
    desc: "This .tscn scene node has script B attached to it." },
  nodeRef:     { color: "#8FBCBB", dash: "8 3 2 3", pad: 60,  strength: 0.3,  arrow: true,
    desc: "A looks up a typed reference to B, e.g. via GetNode<B>() or FindChild<B>()." },
};

// Everything is drawn on one <canvas>: at thousands of nodes/edges, SVG's
// per-element paint cost made every zoom/pan frame take 100+ ms. d3-force,
// d3-zoom and d3-drag still drive layout and input; hit-testing is done
// in JS (quadtree for nodes, point-to-segment distance for edges).
const canvas = document.getElementById("graph");
let ctx = canvas.getContext("2d"); // let: benchmarks can point draw() at an offscreen canvas
const tooltip = document.getElementById("tooltip");
const MONO = getComputedStyle(document.body).fontFamily;
const BG = "#0E1116", INK = "#D6DEE8", MUTED = "#7D8895";
const LABEL_MIN_K = 0.6;  // below this zoom, only big/focused nodes get labels
const ARROW_MIN_K = 0.3;  // below this zoom, arrowheads are skipped (sub-pixel)
let transform = d3.zoomIdentity;
let viewW = innerWidth, viewH = innerHeight, dpr = 1;
let hoverId = null;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  viewW = innerWidth; viewH = innerHeight;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  requestRedraw();
}
addEventListener("resize", resizeCanvas);

let redrawPending = false;
function requestRedraw() {
  if (redrawPending) return;
  redrawPending = true;
  requestAnimationFrame(() => { redrawPending = false; draw(); });
}

// Drag is registered before zoom: when the pointer is on a node, drag claims
// the gesture (and stops propagation); otherwise subject is null and zoom pans.
function dragSubject(e) {
  const n = nodeAt(transform.invertX(e.x), transform.invertY(e.y));
  return n ? { node: n, x: transform.applyX(n.x), y: transform.applyY(n.y) } : null;
}
d3.select(canvas)
  .call(d3.drag().container(canvas).subject(dragSubject)
    .on("start", e => { if (!e.active) sim.alphaTarget(0.25).restart(); const n = e.subject.node; n.fx = n.x; n.fy = n.y; })
    .on("drag", e => { const n = e.subject.node; n.fx = transform.invertX(e.x); n.fy = transform.invertY(e.y); })
    .on("end", e => { if (!e.active) sim.alphaTarget(0); const n = e.subject.node; n.fx = n.fy = null; }))
  .call(d3.zoom().scaleExtent([0.15, 5])
    .on("zoom", e => { transform = e.transform; markInteracting(); requestRedraw(); }));

// While a zoom/pan gesture is in progress, drawing drops the expensive
// details (dashes, arrowheads); they come back shortly after it stops.
let interacting = false, interactTimer = 0;
function markInteracting() {
  interacting = true;
  clearTimeout(interactTimer);
  interactTimer = setTimeout(() => { interacting = false; requestRedraw(); }, 150);
}

function pointerWorld(e) { return transform.invert([e.offsetX, e.offsetY]); }
canvas.addEventListener("mousemove", e => {
  const [x, y] = pointerWorld(e);
  const n = nodeAt(x, y);
  canvas.style.cursor = (n || edgeAt(x, y)) ? "pointer" : "";
  const id = n?.id ?? null;
  if (id !== hoverId) {
    hoverId = id;
    if (n) showTooltip(e, n); else tooltip.style.opacity = 0;
    requestRedraw();
  } else if (n) moveTooltip(e);
});
canvas.addEventListener("mouseleave", () => {
  if (hoverId !== null) { hoverId = null; requestRedraw(); }
  tooltip.style.opacity = 0;
  canvas.style.cursor = "";
});
canvas.addEventListener("click", e => {
  const [x, y] = pointerWorld(e);
  const n = nodeAt(x, y);
  if (n) { selectNode(n); return; }
  const l = edgeAt(x, y);
  if (l) { selectEdge(l); return; }
  if (selected) { selected = null; refreshSelection(); }
});

let sim, nodes = [], links = [], adjacency = new Map();
const enabledKinds = new Set(Object.keys(EDGE_STYLE));
const hiddenRoles = new Set();
const hiddenNodeIds = new Set();
const hiddenEdgeKeys = new Set();
let selected = null; // { type: "node", id } | { type: "edge", key }

// Group membership is many-to-many: a node can belong to any number of groups
// at once. Seeded from each node's `groups` array on load, then freely
// editable in the viewer (add/rename/delete/hide are all client-side only
// until exported).
let groupMembership = new Map(); // name -> Set<nodeId>
let hiddenGroupBubbles = new Set(); // group name -> hull hidden (visual only)
let hiddenGroupNodes = new Set();   // group name -> members hidden (like a role)
let selectedGroup = null;
const groupColor = d3.scaleOrdinal(d3.schemeTableau10.map(c => c));

// Persistent per-node repulsion offset, independent of selection: a node stays
// nudged this way whether or not it's currently selected. The slider that
// edits a given node's value only shows up in the Selection panel while that
// node is selected -- the value itself isn't tied to selection state.
let nodeChargeOverride = new Map(); // nodeId -> number, default 0
function chargeStrength(d) {
  return -(40 + d.r * 9) * chargeScale - (nodeChargeOverride.get(d.id) ?? 0);
}
function rebuildChargeForce() {
  sim?.force("charge", d3.forceManyBody().strength(chargeStrength));
  sim?.alpha(0.4).restart();
}

// id -> [group names], rebuilt from groupMembership at the top of every
// render() (every membership mutation ends in a render()). Forces call
// groupsOfNode() per node per tick, so it must be O(1).
let nodeGroups = new Map();
const NO_GROUPS = [];
function rebuildGroupIndex() {
  nodeGroups = new Map();
  for (const [name, members] of groupMembership) {
    for (const id of members) {
      let gs = nodeGroups.get(id);
      if (!gs) nodeGroups.set(id, gs = []);
      gs.push(name);
    }
  }
}
function groupsOfNode(id) { return nodeGroups.get(id) ?? NO_GROUPS; }

function radius(n) {
  if (n.kind === "scene") return 9;
  return Math.max(7, Math.min(34, 2.6 * Math.sqrt((n.bytes || 800) / 100)));
}

function restLength(l) {
  return (EDGE_STYLE[l.kind]?.pad ?? 50) * springScale + l.source.r + l.target.r;
}

function edgeKey(l) { return `${l.from}|${l.to}|${l.kind}|${l.signal ?? ""}`; }

let chargeScale = 1, springScale = 1, interGroupScale = 3;

function build(data) {
  nodes = data.nodes.map(n => ({ ...n, r: 0 }));
  nodes.forEach(n => n.r = radius(n));
  const byId = new Map(nodes.map(n => [n.id, n]));
  links = data.edges
    .filter(e => byId.has(e.from) && byId.has(e.to))
    .map(e => ({ ...e, source: e.from, target: e.to }));

  adjacency = new Map(nodes.map(n => [n.id, new Set([n.id])]));
  for (const l of links) { adjacency.get(l.from).add(l.to); adjacency.get(l.to).add(l.from); }

  hiddenNodeIds.clear(); hiddenEdgeKeys.clear(); selected = null; hoverId = null;
  nodeChargeOverride = new Map();

  groupMembership = new Map();
  for (const n of nodes) {
    for (const g of (n.groups || [])) {
      if (!groupMembership.has(g)) groupMembership.set(g, new Set());
      groupMembership.get(g).add(n.id);
    }
  }
  hiddenGroupBubbles = new Set();
  hiddenGroupNodes = new Set();
  selectedGroup = null;

  const W = innerWidth, H = innerHeight;
  sim = d3.forceSimulation([])
    .force("link", d3.forceLink([]).id(d => d.id))
    .force("charge", d3.forceManyBody().strength(chargeStrength))
    .force("collide", d3.forceCollide(d => d.r + 5).iterations(2))
    .force("x", d3.forceX(W / 2).strength(0.03))
    .force("y", d3.forceY(H / 2).strength(0.03))
    .force("cluster", clusterForce(0.18))
    .force("interGroup", interGroupForce())
    .on("tick", tick);

  render();
  updateStats(data);
}

// Nodes/links currently passing every visibility filter: enabled edge kinds,
// hidden roles, hidden groups, and individually-hidden nodes/edges.
function currentGraph() {
  const activeNodes = nodes.filter(n =>
    !hiddenNodeIds.has(n.id) &&
    !hiddenRoles.has(n.role) &&
    !groupsOfNode(n.id).some(g => hiddenGroupNodes.has(g)));
  const activeIds = new Set(activeNodes.map(n => n.id));
  const activeLinks = links.filter(l =>
    enabledKinds.has(l.kind) && !hiddenEdgeKeys.has(edgeKey(l)) &&
    activeIds.has(l.from) && activeIds.has(l.to));
  return { activeNodes, activeLinks };
}

// Per-tick group centroids over the active nodes, shared by the cluster and
// inter-group forces (both run within the same tick, before positions move).
let centroidCache = null, centroidStamp = -1, tickCount = 0;
function groupCentroids(nodesRef) {
  if (centroidCache && centroidStamp === tickCount) return centroidCache;
  const acc = new Map();
  for (const n of nodesRef) {
    for (const g of groupsOfNode(n.id)) {
      let c = acc.get(g);
      if (!c) acc.set(g, c = { x: 0, y: 0, n: 0 });
      c.x += n.x; c.y += n.y; c.n++;
    }
  }
  for (const c of acc.values()) { c.x /= c.n; c.y /= c.n; }
  centroidCache = acc; centroidStamp = tickCount;
  return acc;
}

// gentle pull toward the (average, if in several) centroid of a node's groups,
// so bubbles self-segregate; no-ops entirely when "group bubbles" is unchecked.
function clusterForce(strength) {
  let nodesRef;
  function force(alpha) {
    if (!groupBubbles) return;
    const cents = groupCentroids(nodesRef);
    for (const n of nodesRef) {
      const gs = groupsOfNode(n.id);
      if (!gs.length) continue;
      let cx = 0, cy = 0;
      for (const g of gs) { const c = cents.get(g); cx += c.x; cy += c.y; }
      cx /= gs.length; cy /= gs.length;
      n.vx += (cx - n.x) * strength * alpha;
      n.vy += (cy - n.y) * strength * alpha;
    }
  }
  force.initialize = n => nodesRef = n;
  return force;
}

// Pushes every node away from the centroid of every group it does NOT belong
// to. Two groups' members aren't in each other's group, so this separates
// groups from each other as a side effect of the same rule that pushes
// non-member/ungrouped nodes clear of bubbles they're not part of. Reads
// interGroupScale live, so the slider needs no force-rebuild wiring.
function interGroupForce() {
  let nodesRef;
  function force(alpha) {
    if (!groupBubbles || interGroupScale === 0 || groupMembership.size === 0) return;
    const cents = groupCentroids(nodesRef);
    const k = interGroupScale * 4000 * alpha;
    for (const n of nodesRef) {
      const mine = groupsOfNode(n.id);
      for (const [name, c] of cents) {
        if (mine.includes(name)) continue;
        const dx = n.x - c.x, dy = n.y - c.y;
        const f = k / Math.max(dx * dx + dy * dy, 100);
        n.vx += dx * f;
        n.vy += dy * f;
      }
    }
  }
  force.initialize = n => nodesRef = n;
  return force;
}

let activeLinksCache = [], linkBuckets = [], selectedLink = null;
let hullShapes = [], quadtree = null;

// Single entry point for any visibility/group change: recomputes the active
// node/link sets, feeds them to the simulation (so hidden/filtered items drop
// out of physics too, not just the drawing), and redraws. Pure selection
// changes go through refreshSelection() instead, so they don't reheat physics.
function render() {
  rebuildGroupIndex();
  const { activeNodes, activeLinks } = currentGraph();

  sim.nodes(activeNodes);
  sim.force("link", d3.forceLink(activeLinks).id(d => d.id)
    .distance(restLength).strength(l => EDGE_STYLE[l.kind]?.strength ?? 0.4));

  activeNodes.forEach((n, i) => n._i = i);
  activeLinksCache = activeLinks;
  buildLinkBuckets(activeLinks);
  centroidCache = null; quadtree = null;
  updateTips();
  computeHulls();

  sim.alpha(0.6).restart();
  refreshSelection();
  updateHiddenPanel();
  updateGroupPanel();
  saveSession();
}

function refreshSelection() {
  selectedLink = selected?.type === "edge"
    ? activeLinksCache.find(l => edgeKey(l) === selected.key) ?? null : null;
  updateSelectionPanel();
  requestRedraw();
}

// Links are drawn in batches sharing one stroke style (one Path2D per batch),
// which is what keeps ~10k+ edges cheap to redraw.
function buildLinkBuckets(activeLinks) {
  const byKey = new Map();
  for (const l of activeLinks) {
    const s = EDGE_STYLE[l.kind];
    const w = l.kind === "calls" ? Math.min(4, 0.8 + Math.sqrt(l.weight ?? 1) * 0.5) : 1.3;
    const a = l.kind === "calls" ? Math.min(0.85, 0.3 + (l.weight ?? 1) * 0.06) : 0.65;
    const key = `${l.kind}|${w.toFixed(2)}|${a.toFixed(2)}`;
    let b = byKey.get(key);
    if (!b) byKey.set(key, b = { style: s, w, a, dash: s.dash ? s.dash.split(" ").map(Number) : [], links: [] });
    b.links.push(l);
  }
  linkBuckets = Array.from(byKey.values());
}

function tick() {
  tickCount++;
  quadtree = null;
  updateTips();
  requestRedraw(); // hulls are recomputed lazily, at most once per drawn frame
}

// shorten each line so arrowheads sit on the node rim (stored as l.tx/l.ty)
function updateTips() {
  for (const l of activeLinksCache) {
    const s = l.source, t = l.target;
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    const cut = EDGE_STYLE[l.kind].arrow ? t.r + 3 : 0;
    l.tx = t.x - dx / dist * cut;
    l.ty = t.y - dy / dist * cut;
  }
}

// Bubbles are two filled hulls: the members' own hull (fill) and one grown by
// HULL_PAD (the soft rim). The SVG version stroked the hull 46px wide, but a
// wide canvas stroke on a long curved path is very slow to rasterize; filling
// a padded hull looks the same and is cheap.
const hullLine = d3.line().curve(d3.curveCatmullRomClosed);
const HULL_PAD = 23;
const HULL_DIRS = d3.range(8).map(i => [Math.cos(i * Math.PI / 4), Math.sin(i * Math.PI / 4)]);
let hullTick = -1;
function computeHulls() {
  hullShapes = [];
  hullTick = tickCount;
  if (!groupBubbles || !sim) return;
  const byGroup = new Map();
  for (const n of sim.nodes()) {
    for (const g of groupsOfNode(n.id)) {
      if (hiddenGroupBubbles.has(g)) continue;
      let ms = byGroup.get(g);
      if (!ms) byGroup.set(g, ms = []);
      ms.push(n);
    }
  }
  for (const name of groupMembership.keys()) {
    const ms = byGroup.get(name);
    if (!ms || ms.length < 2) continue;
    const inner = [], outer = [];
    for (const n of ms) {
      inner.push([n.x - n.r, n.y], [n.x + n.r, n.y], [n.x, n.y - n.r], [n.x, n.y + n.r]);
      const R = n.r + HULL_PAD;
      for (const [cx, cy] of HULL_DIRS) outer.push([n.x + cx * R, n.y + cy * R]);
    }
    const hull = d3.polygonHull(inner) ?? inner;
    const rim = d3.polygonHull(outer) ?? outer;
    hullShapes.push({
      name, color: groupColor(name),
      // rim = padded hull minus the hull itself (even-odd), i.e. just the band
      fill: new Path2D(hullLine(hull)), rim: new Path2D(hullLine(rim) + hullLine(hull)),
      cx: d3.polygonCentroid(hull)[0], top: d3.min(hull, p => p[1]) - 34,
    });
  }
}
// Recomputes bubble shapes (e.g. after toggling one) and redraws.
function drawHulls() { computeHulls(); requestRedraw(); }

// ---------------------------------------------------------------- hit-testing
function hitsNode(n, x, y) {
  const dx = Math.abs(x - n.x), dy = Math.abs(y - n.y);
  return n.kind === "scene" ? dx + dy <= n.r * Math.SQRT2 : dx * dx + dy * dy <= n.r * n.r;
}
// Topmost (last-drawn) node under a world-space point, or null.
function nodeAt(x, y) {
  if (!sim) return null;
  if (!quadtree) quadtree = d3.quadtree(sim.nodes(), d => d.x, d => d.y);
  const R = 34 * Math.SQRT2;
  let best = null;
  quadtree.visit((q, x0, y0, x1, y1) => {
    if (!q.length) {
      let leaf = q;
      do {
        const n = leaf.data;
        if (hitsNode(n, x, y) && (!best || n._i > best._i)) best = n;
      } while ((leaf = leaf.next));
    }
    return x0 > x + R || x1 < x - R || y0 > y + R || y1 < y - R;
  });
  return best;
}
// Nearest edge within 7 screen px of a world-space point, or null.
function edgeAt(x, y) {
  const tol = 7 / transform.k;
  let best = null, bestD = tol * tol;
  for (const l of activeLinksCache) {
    const sx = l.source.x, sy = l.source.y, tx = l.tx, ty = l.ty;
    if (x < Math.min(sx, tx) - tol || x > Math.max(sx, tx) + tol ||
        y < Math.min(sy, ty) - tol || y > Math.max(sy, ty) + tol) continue;
    const dx = tx - sx, dy = ty - sy, len2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - sx) * dx + (y - sy) * dy) / len2));
    const ex = sx + t * dx - x, ey = sy + t * dy - y, d2 = ex * ex + ey * ey;
    if (d2 <= bestD) { bestD = d2; best = l; }
  }
  return best;
}

// -------------------------------------------------------------------- drawing
// Canvas performance notes (measured in Chromium, ~13k edges):
//  - one stroke() per edge is ~30x faster than one huge multi-segment path;
//  - native dashes and arrowhead fills are the next most expensive things,
//    so both are dropped below DETAIL_MIN_K (where they'd be sub-pixel anyway)
//    and during zoom/pan gestures (see markInteracting);
//  - everything is culled to the viewport.
const DETAIL_MIN_K = 0.5;
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!sim) return;
  if (hullTick !== tickCount) computeHulls();
  const k = transform.k;
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * transform.x, dpr * transform.y);
  const view = {
    x0: transform.invertX(0), x1: transform.invertX(viewW),
    y0: transform.invertY(0), y1: transform.invertY(viewH),
  };
  // hover wins over selection for the "connected nodes" dimming
  const focusId = hoverId ?? (selected?.type === "node" ? selected.id : null);
  const near = focusId ? adjacency.get(focusId) ?? null : null;

  drawHullLayer();
  drawLinkLayer(k, view, near, focusId);
  drawNodeLayer(view, near);
  drawLabelLayer(k, view, near, focusId);
  ctx.globalAlpha = 1;
}

function drawHullLayer() {
  if (!groupBubbles || !hullShapes.length) return;
  for (const s of hullShapes) {
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.12; ctx.fill(s.rim, "evenodd");
    ctx.globalAlpha = 0.07; ctx.fill(s.fill);
  }
  ctx.font = `11px ${MONO}`;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "2.2px";
  ctx.fillStyle = MUTED; ctx.globalAlpha = 0.75;
  for (const s of hullShapes) ctx.fillText(s.name.toUpperCase(), s.cx, s.top);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}

// Arrowhead at (tx,ty) pointing away from (sx,sy); matches the old SVG
// marker, which scaled with stroke width.
function arrowhead(sx, sy, tx, ty, w) {
  const dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1;
  const ux = dx / d, uy = dy / d, len = 6 * w, hw = 2.6 * w;
  const bx = tx - ux * len, by = ty - uy * len;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(bx - uy * hw, by + ux * hw);
  ctx.lineTo(bx + uy * hw, by - ux * hw);
  ctx.fill();
}

function drawLinkLayer(k, view, near, focusId) {
  const detail = k >= DETAIL_MIN_K && !interacting;
  ctx.lineCap = "butt"; ctx.lineJoin = "miter";
  // dimmed pass first, so focused edges draw on top
  for (const dimPass of near ? [true, false] : [false]) {
    for (const b of linkBuckets) {
      // collect visible links first; then all strokes, then all heads, so
      // consecutive draw calls share state and batch well
      const vis = [];
      for (const l of b.links) {
        const dim = near !== null && l.from !== focusId && l.to !== focusId;
        if (dim !== dimPass) continue;
        const sx = l.source.x, sy = l.source.y, tx = l.tx, ty = l.ty;
        if ((sx < view.x0 && tx < view.x0) || (sx > view.x1 && tx > view.x1) ||
            (sy < view.y0 && ty < view.y0) || (sy > view.y1 && ty > view.y1)) continue;
        vis.push(l);
      }
      if (!vis.length) continue;
      ctx.strokeStyle = ctx.fillStyle = b.style.color;
      ctx.lineWidth = b.w;
      ctx.setLineDash(detail ? b.dash : []);
      ctx.globalAlpha = b.a * (dimPass ? 0.12 : 1);
      for (const l of vis) {
        ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.tx, l.ty); ctx.stroke();
      }
      if (detail && b.style.arrow) {
        ctx.globalAlpha = dimPass ? 0.12 : 1;
        for (const l of vis) arrowhead(l.source.x, l.source.y, l.tx, l.ty, b.w);
      }
    }
  }
  ctx.setLineDash([]);
  if (selectedLink) {
    const l = selectedLink, s = EDGE_STYLE[l.kind];
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ctx.fillStyle = s.color;
    ctx.lineWidth = 3.5;
    ctx.setLineDash(s.dash ? s.dash.split(" ").map(Number) : []);
    ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.tx, l.ty); ctx.stroke();
    ctx.setLineDash([]);
    if (s.arrow) arrowhead(l.source.x, l.source.y, l.tx, l.ty, 1.3);
  }
}

function nodeShape(p, n) {
  if (n.kind === "scene") {
    const d = n.r * Math.SQRT2;
    p.moveTo(n.x, n.y - d); p.lineTo(n.x + d, n.y); p.lineTo(n.x, n.y + d); p.lineTo(n.x - d, n.y);
    p.closePath();
  } else {
    p.moveTo(n.x + n.r, n.y); p.arc(n.x, n.y, n.r, 0, 2 * Math.PI);
  }
}
function nodeFill(n) {
  if (n.kind === "scene") return ROLE_META.scene.color;
  if (n.kind === "interface") return BG;
  return ROLE_META[n.role]?.color ?? ROLE_META.plain.color;
}

function drawNodeLayer(view, near) {
  const m = 34 * Math.SQRT2;
  for (const dimPass of near ? [true, false] : [false]) {
    const fills = new Map(); // color -> Path2D of plain circles
    const scenes = new Path2D(), ifaces = new Path2D();
    let anyScene = false, anyIface = false;
    for (const n of sim.nodes()) {
      if ((near !== null && !near.has(n.id)) !== dimPass) continue;
      if (n.x + m < view.x0 || n.x - m > view.x1 || n.y + m < view.y0 || n.y - m > view.y1) continue;
      if (n.kind === "scene") { nodeShape(scenes, n); anyScene = true; }
      else if (n.kind === "interface") { nodeShape(ifaces, n); anyIface = true; }
      else {
        const c = nodeFill(n);
        let p = fills.get(c);
        if (!p) fills.set(c, p = new Path2D());
        nodeShape(p, n);
      }
    }
    const dimA = dimPass ? 0.12 : 1;
    ctx.globalAlpha = 0.92 * dimA;
    for (const [c, p] of fills) { ctx.fillStyle = c; ctx.fill(p); }
    if (anyScene) { ctx.globalAlpha = 0.85 * dimA; ctx.fillStyle = ROLE_META.scene.color; ctx.fill(scenes); }
    if (anyIface) {
      ctx.globalAlpha = dimA;
      ctx.fillStyle = BG; ctx.fill(ifaces);
      ctx.strokeStyle = ROLE_META.interface.color; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.stroke(ifaces); ctx.setLineDash([]);
    }
  }
  if (selected?.type === "node") {
    const n = sim.nodes().find(n => n.id === selected.id);
    if (n) {
      const p = new Path2D(); nodeShape(p, n);
      ctx.save();
      ctx.globalAlpha = 1; ctx.shadowColor = "#fff"; ctx.shadowBlur = 8 * dpr;
      ctx.fillStyle = nodeFill(n); ctx.fill(p); ctx.fill(p);
      ctx.restore();
      if (n.kind === "interface") {
        ctx.strokeStyle = ROLE_META.interface.color; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
        ctx.stroke(p); ctx.setLineDash([]);
      }
    }
  }
}

// Labels are the costliest thing to paint, so they're culled to the viewport
// and level-of-detailed: all labels at readable zoom, otherwise only big nodes,
// the hovered/selected node and its neighbours.
function drawLabelLayer(k, view, near, focusId) {
  if (!showLabels) return;
  ctx.font = `10px ${MONO}`;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = 3; ctx.lineJoin = "round";
  ctx.strokeStyle = BG; ctx.fillStyle = INK;
  const all = k >= LABEL_MIN_K;
  for (const n of sim.nodes()) {
    const inFocus = near !== null && near.has(n.id);
    if (!all && !inFocus && n.r * k < 12) continue;
    const y = n.y - n.r - 4;
    if (n.x + 200 < view.x0 || n.x - 200 > view.x1 || y + 12 < view.y0 || y - 12 > view.y1) continue;
    ctx.globalAlpha = near !== null && !inFocus ? 0.12 : 1;
    ctx.strokeText(n.label, n.x, y);
    ctx.fillText(n.label, n.x, y);
  }
}

// ------------------------------------------------------------- selection/hide
function selectNode(d) {
  selected = (selected?.type === "node" && selected.id === d.id) ? null : { type: "node", id: d.id };
  refreshSelection();
}
function selectEdge(d) {
  const key = edgeKey(d);
  selected = (selected?.type === "edge" && selected.key === key) ? null : { type: "edge", key };
  refreshSelection();
}
function updateSelectionPanel() {
  const info = document.getElementById("selection-info");
  const hideBtn = document.getElementById("hide-selected");
  const addBtn = document.getElementById("add-to-group");
  const groupsDiv = d3.select("#selection-groups");
  const chargeDiv = document.getElementById("selection-charge");

  if (!selected) {
    info.textContent = "click a node or edge to select it";
    hideBtn.disabled = true;
    addBtn.disabled = true;
    groupsDiv.selectAll("*").remove();
    chargeDiv.style.display = "none";
    return;
  }
  hideBtn.disabled = false;

  if (selected.type === "node") {
    const n = nodes.find(n => n.id === selected.id);
    info.textContent = `selected: ${n?.label ?? selected.id} (node)`;

    const chips = groupsDiv.selectAll("span.group-chip").data(groupsOfNode(selected.id), g => g);
    chips.exit().remove();
    const entered = chips.enter().append("span").attr("class", "group-chip");
    entered.append("span").attr("class", "chip-text");
    entered.append("span").attr("class", "chip-x").text("×")
      .on("click", (e, g) => {
        groupMembership.get(g)?.delete(selected.id);
        render();
      });
    groupsDiv.selectAll("span.group-chip").select(".chip-text").text(g => g);

    addBtn.disabled = !selectedGroup;

    chargeDiv.style.display = "";
    const offset = nodeChargeOverride.get(selected.id) ?? 0;
    document.getElementById("node-charge").value = offset;
    document.getElementById("node-charge-val").textContent = offset;
  } else {
    const l = links.find(l => edgeKey(l) === selected.key);
    info.textContent = l ? `selected: ${l.kind} edge` : "selected: edge";
    groupsDiv.selectAll("*").remove();
    addBtn.disabled = true;
    chargeDiv.style.display = "none";
  }
}
document.getElementById("node-charge").addEventListener("input", function () {
  if (!selected || selected.type !== "node") return;
  const value = +this.value;
  document.getElementById("node-charge-val").textContent = value;
  if (value === 0) nodeChargeOverride.delete(selected.id);
  else nodeChargeOverride.set(selected.id, value);
  rebuildChargeForce();
  saveSession();
});
document.getElementById("hide-selected").addEventListener("click", () => {
  if (!selected) return;
  if (selected.type === "node") hiddenNodeIds.add(selected.id);
  else hiddenEdgeKeys.add(selected.key);
  selected = null;
  render();
});
document.getElementById("add-to-group").addEventListener("click", () => {
  if (!selected || selected.type !== "node" || !selectedGroup) return;
  if (!groupMembership.has(selectedGroup)) groupMembership.set(selectedGroup, new Set());
  groupMembership.get(selectedGroup).add(selected.id);
  render();
});
document.getElementById("restore-all").addEventListener("click", () => {
  hiddenNodeIds.clear();
  hiddenEdgeKeys.clear();
  render();
});
function updateHiddenPanel() {
  const rows = d3.select("#hidden-nodes").selectAll("div.hidden-row")
    .data(Array.from(hiddenNodeIds), id => id);
  rows.exit().remove();
  const entered = rows.enter().append("div").attr("class", "hidden-row");
  entered.append("span").attr("class", "restore-x").text("×")
    .on("click", (e, id) => { hiddenNodeIds.delete(id); render(); });
  entered.append("span").attr("class", "hidden-label");
  d3.select("#hidden-nodes").selectAll("div.hidden-row").select(".hidden-label")
    .text(id => nodes.find(n => n.id === id)?.label ?? id);

  document.getElementById("hidden-edges-count").textContent =
    hiddenEdgeKeys.size ? `${hiddenEdgeKeys.size} edge${hiddenEdgeKeys.size === 1 ? "" : "s"} hidden` : "";
  document.getElementById("restore-all").disabled = hiddenNodeIds.size === 0 && hiddenEdgeKeys.size === 0;
}

// --------------------------------------------------------------------- groups
function updateGroupPanel() {
  const names = Array.from(groupMembership.keys()).sort();
  const rows = d3.select("#group-list").selectAll("div.group-row").data(names, name => name);
  rows.exit().remove();
  const entered = rows.enter().append("div").attr("class", "group-row");
  entered.append("input").attr("type", "checkbox").attr("class", "grp-bubble-cb")
    .on("change", function (e, name) {
      this.checked ? hiddenGroupBubbles.delete(name) : hiddenGroupBubbles.add(name);
      drawHulls();
    });
  entered.append("input").attr("type", "checkbox").attr("class", "grp-nodes-cb")
    .on("change", function (e, name) {
      this.checked ? hiddenGroupNodes.delete(name) : hiddenGroupNodes.add(name);
      render();
    });
  entered.append("span").attr("class", "group-name")
    .on("click", (e, name) => {
      selectedGroup = selectedGroup === name ? null : name;
      updateGroupPanel();
      updateSelectionPanel();
    })
    .on("dblclick", (e, name) => renameGroup(name));
  entered.append("span").attr("class", "group-del").text("×")
    .on("click", (e, name) => deleteGroup(name));

  const merged = d3.select("#group-list").selectAll("div.group-row");
  merged.select(".grp-bubble-cb").property("checked", name => !hiddenGroupBubbles.has(name));
  merged.select(".grp-nodes-cb").property("checked", name => !hiddenGroupNodes.has(name));
  merged.select(".group-name")
    .text(name => `${name} (${groupMembership.get(name).size})`)
    .style("color", name => groupColor(name))
    .classed("group-name-selected", name => selectedGroup === name);
}

function renameGroup(oldName) {
  const next = prompt(`Rename group "${oldName}" to:`, oldName);
  if (next === null) return;
  const trimmed = next.trim();
  if (!trimmed || trimmed === oldName) return;

  const members = groupMembership.get(oldName) ?? new Set();
  groupMembership.delete(oldName);
  if (groupMembership.has(trimmed)) {
    for (const id of members) groupMembership.get(trimmed).add(id);
  } else {
    groupMembership.set(trimmed, members);
  }
  if (hiddenGroupBubbles.delete(oldName)) hiddenGroupBubbles.add(trimmed);
  if (hiddenGroupNodes.delete(oldName)) hiddenGroupNodes.add(trimmed);
  if (selectedGroup === oldName) selectedGroup = trimmed;
  render();
}

function deleteGroup(name) {
  groupMembership.delete(name);
  hiddenGroupBubbles.delete(name);
  hiddenGroupNodes.delete(name);
  if (selectedGroup === name) selectedGroup = null;
  render();
}

document.getElementById("new-group-btn").addEventListener("click", createGroupFromInput);
document.getElementById("new-group-name").addEventListener("keydown", e => {
  if (e.key === "Enter") createGroupFromInput();
});
function createGroupFromInput() {
  const input = document.getElementById("new-group-name");
  const name = input.value.trim();
  if (!name || groupMembership.has(name)) return;
  groupMembership.set(name, new Set());
  input.value = "";
  updateGroupPanel();
  saveSession();
}

document.getElementById("export-groups").addEventListener("click", () => {
  rebuildGroupIndex();
  const groups = {};
  for (const n of nodes) {
    const gs = groupsOfNode(n.id);
    if (gs.length) groups[n.id] = gs;
  }
  const blob = new Blob([JSON.stringify({ groups }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "codegraph.config.groups.json";
  a.click();
  URL.revokeObjectURL(url);
});

// Imports a previously-exported {groups: {nodeId: [name,...]}} snippet (same
// shape as codegraph.config.json's "groups" key) and merges it into the
// current in-memory groups -- doesn't require a re-extract. Ids not present
// in the currently-loaded graph are dropped silently.
document.getElementById("import-groups").addEventListener("click", () => {
  document.getElementById("import-groups-file").click();
});
document.getElementById("import-groups-file").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(text => {
    let parsed;
    try { parsed = JSON.parse(text); }
    catch { alert("Not valid JSON."); return; }
    const groups = parsed.groups ?? {};
    const validIds = new Set(nodes.map(n => n.id));
    for (const [nodeId, groupNames] of Object.entries(groups)) {
      if (!validIds.has(nodeId)) continue;
      for (const name of groupNames) {
        if (!groupMembership.has(name)) groupMembership.set(name, new Set());
        groupMembership.get(name).add(nodeId);
      }
    }
    updateGroupPanel();
    render();
  });
  e.target.value = "";
});

// Discards any session/live-edited group overrides and rebuilds groups from
// the currently-loaded graph.json's own "groups" field on each node -- the
// escape hatch for when session groups have gone stale relative to a
// re-extracted file.
document.getElementById("reset-groups").addEventListener("click", () => {
  groupMembership = new Map();
  for (const n of nodes) {
    for (const g of (n.groups || [])) {
      if (!groupMembership.has(g)) groupMembership.set(g, new Set());
      groupMembership.get(g).add(n.id);
    }
  }
  hiddenGroupBubbles = new Set();
  hiddenGroupNodes = new Set();
  selectedGroup = null;
  updateGroupPanel();
  render();
});

function showTooltip(e, d) {
  const sigs = [];
  if (d.signalsDeclared?.length) sigs.push(`declares: ${d.signalsDeclared.join(", ")}`);
  if (d.signalsEmitted?.length) sigs.push(`emits: ${d.signalsEmitted.join(", ")}`);
  const groupText = (d.groups?.length ? d.groups : groupsOfNode(d.id)).join(", ") || "(none)";
  tooltip.innerHTML =
    `<div class="t-name">${d.label}</div>` +
    (d.file ? `<div class="t-file">${d.file}</div>` : "") +
    `<div class="t-meta">${d.kind} · ${d.role} · ${groupText}` +
    (d.loc ? ` · ${d.loc} loc` : "") + (d.baseType ? ` · : ${d.baseType}` : "") + `</div>` +
    sigs.map(s => `<div class="t-sig">${s}</div>`).join("") +
    (d.scenes?.length ? `<div class="t-meta">in: ${d.scenes.join(", ")}</div>` : "");
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function showDescTooltip(e, title, desc) {
  tooltip.innerHTML = `<div class="t-name">${title}</div><div class="t-meta t-desc">${desc}</div>`;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + "px";
  tooltip.style.top = (e.clientY + 14) + "px";
}

function updateStats(data) {
  document.getElementById("stats").textContent =
    `${data.nodes.length} nodes · ${data.edges.length} edges` +
    (data.meta?.generatedAt ? ` · ${data.meta.generatedAt.slice(0, 10)}` : "");
}

// ------------------------------------------------------------------ controls
let groupBubbles = true, showLabels = true;

const edgeToggles = d3.select("#edge-toggles");
for (const [kind, s] of Object.entries(EDGE_STYLE)) {
  const row = edgeToggles.append("label").attr("class", "row");
  row.append("input").attr("type", "checkbox").attr("data-kind", kind).property("checked", true)
    .on("change", function () {
      this.checked ? enabledKinds.add(kind) : enabledKinds.delete(kind);
      render();
    });
  row.append("svg").attr("class", "edgekey").attr("height", 6)
    .append("line").attr("x1", 0).attr("x2", 22).attr("y1", 3).attr("y2", 3)
    .attr("stroke", s.color).attr("stroke-width", 2).attr("stroke-dasharray", s.dash);
  row.append("span").text(kind);
  row.on("mouseenter", e => showDescTooltip(e, kind, s.desc))
    .on("mousemove", moveTooltip)
    .on("mouseleave", () => tooltip.style.opacity = 0);
}
const roleLegend = d3.select("#role-legend");
for (const [role, meta] of Object.entries(ROLE_META)) {
  const row = roleLegend.append("label").attr("class", "row");
  row.append("input").attr("type", "checkbox").attr("data-role", role).property("checked", true)
    .on("change", function () {
      this.checked ? hiddenRoles.delete(role) : hiddenRoles.add(role);
      render();
    });
  row.append("span").attr("class", "swatch").style("background", meta.color);
  row.append("span").text(role);
  row.on("mouseenter", e => showDescTooltip(e, role, meta.desc))
    .on("mousemove", moveTooltip)
    .on("mouseleave", () => tooltip.style.opacity = 0);
}

d3.select("#charge").on("input", function () {

// -------------------------------------------------------------- persistence
// Remembers the last-loaded graph's path plus groups/overrides/physics
// settings across reloads. Deliberately does NOT store the graph itself
// (could be large, and would go stale vs. the extractor's actual output) --
// just enough to re-fetch the same file and reapply the same customizations.
const SESSION_KEY = "codegraph:session:v1";
let currentGraphPath = null; // null when loaded via fetch("graph.json") or drag-drop

function saveSession() {
  try {
    const session = {
      graphPath: currentGraphPath,
      groups: Object.fromEntries(Array.from(groupMembership, ([k, v]) => [k, Array.from(v)])),
      hiddenGroupBubbles: Array.from(hiddenGroupBubbles),
      hiddenGroupNodes: Array.from(hiddenGroupNodes),
      nodeChargeOverride: Object.fromEntries(nodeChargeOverride),
      hiddenRoles: Array.from(hiddenRoles),
      disabledKinds: Object.keys(EDGE_STYLE).filter(k => !enabledKinds.has(k)),
      chargeScale, springScale, interGroupScale, groupBubbles, showLabels,
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch { /* localStorage unavailable or full -- not worth failing over */ }
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch { return null; }
}

// Reapplies a previously-saved session's groups/overrides/settings on top of
// a freshly-built graph. Filters out anything referencing nodes/groups that
// no longer exist (e.g. after a re-extract), so a stale session can't crash
// or silently corrupt the new graph.
function applySavedState(session) {
  if (!session) return;
  const validIds = new Set(nodes.map(n => n.id));

  if (session.groups) {
    groupMembership = new Map();
    for (const [name, ids] of Object.entries(session.groups)) {
      groupMembership.set(name, new Set(ids.filter(id => validIds.has(id))));
    }
  }
  hiddenGroupBubbles = new Set((session.hiddenGroupBubbles ?? []).filter(g => groupMembership.has(g)));
  hiddenGroupNodes = new Set((session.hiddenGroupNodes ?? []).filter(g => groupMembership.has(g)));
  nodeChargeOverride = new Map(
    Object.entries(session.nodeChargeOverride ?? {}).filter(([id]) => validIds.has(id)));

  hiddenRoles.clear();
  for (const r of session.hiddenRoles ?? []) hiddenRoles.add(r);

  for (const k of Object.keys(EDGE_STYLE)) enabledKinds.add(k);
  for (const k of session.disabledKinds ?? []) enabledKinds.delete(k);

  if (typeof session.chargeScale === "number") chargeScale = session.chargeScale;
  if (typeof session.springScale === "number") springScale = session.springScale;
  if (typeof session.interGroupScale === "number") interGroupScale = session.interGroupScale;
  if (typeof session.groupBubbles === "boolean") groupBubbles = session.groupBubbles;
  if (typeof session.showLabels === "boolean") showLabels = session.showLabels;

  syncControlsFromState();
  rebuildChargeForce();
  render();
}

// Pushes the current in-memory settings back onto the actual controls, since
// restoring state programmatically doesn't touch their DOM values/checked.
function syncControlsFromState() {
  document.getElementById("charge").value = chargeScale;
  document.getElementById("charge-val").textContent = chargeScale.toFixed(2);
  document.getElementById("spring").value = springScale;
  document.getElementById("spring-val").textContent = springScale.toFixed(2);
  document.getElementById("intergroup").value = interGroupScale;
  document.getElementById("intergroup-val").textContent = interGroupScale.toFixed(1);
  document.getElementById("hulls").checked = groupBubbles;
  document.getElementById("labels").checked = showLabels;

  d3.selectAll("#edge-toggles input[data-kind]")
    .property("checked", function () { return enabledKinds.has(this.dataset.kind); });
  d3.selectAll("#role-legend input[data-role]")
    .property("checked", function () { return !hiddenRoles.has(this.dataset.role); });
}

// ------------------------------------------------------------------ data load
document.querySelector("#loadfile input").addEventListener("change", e => loadFile(e.target.files[0]));
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
function loadFile(file) {
  if (!file) return;
  currentGraphPath = null; // dropped/picked files have no re-fetchable path
  file.text().then(t => { sim?.stop(); build(JSON.parse(t)); });
}

// Loads an arbitrary local graph.json by absolute path via the serve.py
// /api/graph endpoint (plain static servers -- or file://, which this whole
// feature can't work under anyway -- will just 404/fail here).
function loadGraphFromPath(path, session) {
  const errorEl = document.getElementById("path-error");
  return fetch(`/api/graph?path=${encodeURIComponent(path)}`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      currentGraphPath = path;
      document.getElementById("path-input").value = path;
      errorEl.textContent = "";
      sim?.stop();
      build(data);
      applySavedState(session);
    })
    .catch(err => { errorEl.textContent = `Failed to load "${path}": ${err.message}`; });
}
document.getElementById("path-load-btn").addEventListener("click", () => {
  const path = document.getElementById("path-input").value.trim();
  if (path) loadGraphFromPath(path, null);
});
document.getElementById("path-input").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("path-load-btn").click();
});

resizeCanvas();
const savedSession = loadSession();
if (savedSession?.graphPath) {
  loadGraphFromPath(savedSession.graphPath, savedSession).catch(() => {});
} else {
  fetch("graph.json")
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(build)
    .catch(() => build(SAMPLE));
}
