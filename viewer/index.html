<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code·graph</title>
<style>
  :root {
    --bg: #0E1116; --panel: #161B22cc; --line: #232B36;
    --ink: #D6DEE8; --muted: #7D8895; --accent: #45C4B8;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 12px/1.5 var(--mono); overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; cursor: grab; }
  svg:active { cursor: grabbing; }

  #brand { position: fixed; top: 14px; left: 16px; letter-spacing: .35em;
    font-size: 13px; color: var(--muted); user-select: none; pointer-events: none; }
  #brand b { color: var(--ink); font-weight: 600; }

  #rail { position: fixed; top: 44px; left: 16px; width: 210px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    backdrop-filter: blur(6px); max-height: calc(100vh - 60px); overflow-y: auto; }
  #rail h2 { font-size: 10px; font-weight: 600; letter-spacing: .18em; color: var(--muted);
    text-transform: uppercase; margin: 14px 0 6px; }
  #rail h2:first-child { margin-top: 0; }
  label.row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
  label.row input { accent-color: var(--accent); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .edgekey { display: block; width: 22px; height: 6px; flex: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-label { display: flex; justify-content: space-between; color: var(--muted); margin-top: 6px; }
  #loadfile { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #loadfile input { width: 100%; }
  #stats { color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }

  #selection-info { color: var(--muted); margin-bottom: 6px; min-height: 15px; }
  #selection-groups { margin-bottom: 6px; }
  button { font: 12px var(--mono); background: #1B2230; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: default; opacity: .5; }
  .btn-row { display: flex; gap: 6px; }
  #new-group-name { flex: 1; min-width: 0; background: #1B2230; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: 12px var(--mono); }

  .hidden-row { display: flex; align-items: center; gap: 6px; padding: 2px 0;
    color: var(--muted); }
  .hidden-row .restore-x { cursor: pointer; color: var(--accent); flex: none;
    width: 14px; text-align: center; }
  .hidden-row .hidden-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hidden-empty { color: var(--muted); font-style: italic; }

  .group-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .group-row input[type=checkbox] { margin: 0; accent-color: var(--accent); }
  .group-name { cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .group-name.group-name-selected { text-decoration: underline; font-weight: 600; }
  .group-del { cursor: pointer; color: var(--muted); flex: none; width: 12px; text-align: center; }
  .group-del:hover { color: var(--accent); }
  .group-chip { display: inline-flex; align-items: center; gap: 4px; background: #1B2230;
    border: 1px solid var(--line); border-radius: 10px; padding: 1px 6px; margin: 2px 4px 2px 0;
    font-size: 11px; }
  .group-chip .chip-x { cursor: pointer; color: var(--accent); }

  #tooltip { position: fixed; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 300px;
    opacity: 0; transition: opacity .12s; backdrop-filter: blur(6px); z-index: 10; }
  #tooltip .t-name { font-weight: 600; }
  #tooltip .t-file, #tooltip .t-meta { color: var(--muted); font-size: 11px; }
  #tooltip .t-sig { color: var(--accent); font-size: 11px; }
  #tooltip .t-desc { max-width: 220px; }

  .hull { stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  .hull-label { fill: var(--muted); font-size: 11px; letter-spacing: .2em;
    text-transform: uppercase; pointer-events: none; opacity: .75; }
  .link { fill: none; pointer-events: none; }
  .link-hit { fill: none; stroke: transparent; stroke-width: 14px; cursor: pointer; }
  .link.selected { stroke-width: 3.5px !important; stroke-opacity: 1 !important; }
  .node { cursor: pointer; }
  .node text { fill: var(--ink); font-size: 10px; pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node.selected > circle, .node.selected > rect {
    filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 4px #fff); }
  .dimmed { opacity: .12; transition: opacity .15s; }
</style>
</head>
<body>
<div id="brand"><b>code</b>·graph</div>
<div id="rail">
  <h2>Edges</h2><div id="edge-toggles"></div>
  <h2>Roles</h2><div id="role-legend"></div>
  <h2>Groups</h2>
  <div id="group-list"></div>
  <div class="btn-row" style="margin-top:6px">
    <input type="text" id="new-group-name" placeholder="new group name">
    <button id="new-group-btn">+</button>
  </div>
  <div class="btn-row" style="margin-top:6px">
    <button id="export-groups">export groups</button>
  </div>
  <h2>Physics</h2>
  <div class="slider-label"><span>repulsion</span><span id="charge-val"></span></div>
  <input type="range" id="charge" min="0.3" max="10" step="0.05" value="1">
  <div class="slider-label"><span>spring length</span><span id="spring-val"></span></div>
  <input type="range" id="spring" min="0.5" max="8" step="0.05" value="1">
  <label class="row" style="margin-top:8px"><input type="checkbox" id="hulls" checked> group bubbles</label>
  <label class="row"><input type="checkbox" id="labels" checked> labels</label>
  <h2>Selection</h2>
  <div id="selection-info">click a node or edge to select it</div>
  <div id="selection-groups"></div>
  <div class="btn-row">
    <button id="hide-selected" disabled>hide selected</button>
    <button id="add-to-group" disabled>add to group</button>
  </div>
  <h2>Hidden</h2>
  <div id="hidden-nodes"></div>
  <div id="hidden-edges-count" style="color:var(--muted); margin-top:4px;"></div>
  <div class="btn-row" style="margin-top:6px">
    <button id="restore-all" disabled>restore all</button>
  </div>
  <h2>Data</h2>
  <div id="loadfile">load graph.json (or drop it anywhere)<input type="file" accept=".json"></div>
  <div id="stats"></div>
</div>
<div id="tooltip"></div>
<svg></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";

const ROLE_META = {
  manager:   { color: "#E8B04B", desc: "Autoloaded singleton (Godot [autoload])." },
  object:    { color: "#5B9FE3", desc: "Nearest Godot base is Node — a plain gameplay object." },
  ui:        { color: "#C792EA", desc: "Nearest Godot base is Control." },
  data:      { color: "#6FBF73", desc: "Nearest Godot base is Resource — typically inert data." },
  utility:   { color: "#8A93A6", desc: "Static class with no instance state." },
  interface: { color: "#45C4B8", desc: "A C# interface." },
  scene:     { color: "#E06C75", desc: "A .tscn scene file." },
  plain:     { color: "#5A6675", desc: "No stronger heuristic matched; an ordinary C# type." },
};
const EDGE_STYLE = { // stroke, dasharray, base rest-length padding, spring strength
  inherits:    { color: "#B48EAD", dash: null,      pad: 60,  strength: 0.7,  arrow: true,
    desc: "A's base class is B (A extends B)." },
  implements:  { color: "#45C4B8", dash: "6 4",     pad: 70,  strength: 0.5,  arrow: true,
    desc: "A implements interface B." },
  calls:       { color: "#5F6B7A", dash: null,      pad: 40,  strength: 0.35, arrow: true,
    desc: "A invokes a method defined on B. Thicker/more opaque lines mean more call sites." },
  composes:    { color: "#E8B04B", dash: null,      pad: 50,  strength: 0.5,  arrow: true,
    desc: "A holds a field or property of type B (a “has-a” relationship)." },
  signal:      { color: "#E06C75", dash: "2 5",     pad: 90,  strength: 0.15, arrow: true,
    desc: "A listens for a signal declared/emitted by B, via Connect(), a C# event +=, or a Godot .tscn [connection]." },
  sceneAttach: { color: "#4A5568", dash: "1 4",     pad: 55,  strength: 0.4,  arrow: true,
    desc: "This .tscn scene node has script B attached to it." },
  nodeRef:     { color: "#8FBCBB", dash: "8 3 2 3", pad: 60,  strength: 0.3,  arrow: true,
    desc: "A looks up a typed reference to B, e.g. via GetNode<B>() or FindChild<B>()." },
};

const svg = d3.select("svg");
const zoomLayer = svg.append("g");
const hullLayer = zoomLayer.append("g");
const linkLayer = zoomLayer.append("g");
const nodeLayer = zoomLayer.append("g");
const tooltip = document.getElementById("tooltip");

// arrowheads per edge kind
const defs = svg.append("defs");
for (const [kind, s] of Object.entries(EDGE_STYLE)) {
  if (!s.arrow) continue;
  defs.append("marker").attr("id", `arrow-${kind}`)
    .attr("viewBox", "0 -4 8 8").attr("refX", 7).attr("markerWidth", 6)
    .attr("markerHeight", 6).attr("orient", "auto")
    .append("path").attr("d", "M0,-3.5L8,0L0,3.5").attr("fill", s.color);
}

svg.call(d3.zoom().scaleExtent([0.15, 5])
  .on("zoom", e => zoomLayer.attr("transform", e.transform)));
svg.on("click", () => { if (selected) { selected = null; render(); } });

let sim, nodes = [], links = [], adjacency = new Map();
const enabledKinds = new Set(Object.keys(EDGE_STYLE));
const hiddenRoles = new Set();
const hiddenNodeIds = new Set();
const hiddenEdgeKeys = new Set();
let selected = null; // { type: "node", id } | { type: "edge", key }

// Group membership is many-to-many: a node can belong to any number of groups
// at once. Seeded from each node's `groups` array on load, then freely
// editable in the viewer (add/rename/delete/hide are all client-side only
// until exported).
let groupMembership = new Map(); // name -> Set<nodeId>
let hiddenGroupBubbles = new Set(); // group name -> hull hidden (visual only)
let hiddenGroupNodes = new Set();   // group name -> members hidden (like a role)
let selectedGroup = null;
const groupColor = d3.scaleOrdinal(d3.schemeTableau10.map(c => c));

function groupsOfNode(id) {
  const gs = [];
  for (const [name, members] of groupMembership) if (members.has(id)) gs.push(name);
  return gs;
}

function radius(n) {
  if (n.kind === "scene") return 9;
  return Math.max(7, Math.min(34, 2.6 * Math.sqrt((n.bytes || 800) / 100)));
}

function restLength(l) {
  return (EDGE_STYLE[l.kind]?.pad ?? 50) * springScale + l.source.r + l.target.r;
}

function edgeKey(l) { return `${l.from}|${l.to}|${l.kind}|${l.signal ?? ""}`; }

let chargeScale = 1, springScale = 1;

function build(data) {
  nodes = data.nodes.map(n => ({ ...n, r: 0 }));
  nodes.forEach(n => n.r = radius(n));
  const byId = new Map(nodes.map(n => [n.id, n]));
  links = data.edges
    .filter(e => byId.has(e.from) && byId.has(e.to))
    .map(e => ({ ...e, source: e.from, target: e.to }));

  adjacency = new Map(nodes.map(n => [n.id, new Set([n.id])]));
  for (const l of links) { adjacency.get(l.from).add(l.to); adjacency.get(l.to).add(l.from); }

  hiddenNodeIds.clear(); hiddenEdgeKeys.clear(); selected = null;

  groupMembership = new Map();
  for (const n of nodes) {
    for (const g of (n.groups || [])) {
      if (!groupMembership.has(g)) groupMembership.set(g, new Set());
      groupMembership.get(g).add(n.id);
    }
  }
  hiddenGroupBubbles = new Set();
  hiddenGroupNodes = new Set();
  selectedGroup = null;

  const W = innerWidth, H = innerHeight;
  sim = d3.forceSimulation([])
    .force("link", d3.forceLink([]).id(d => d.id))
    .force("charge", d3.forceManyBody().strength(d => -(40 + d.r * 9) * chargeScale))
    .force("collide", d3.forceCollide(d => d.r + 5).iterations(2))
    .force("x", d3.forceX(W / 2).strength(0.03))
    .force("y", d3.forceY(H / 2).strength(0.03))
    .force("cluster", clusterForce(0.18))
    .on("tick", tick);

  render();
  updateStats(data);
}

// Nodes/links currently passing every visibility filter: enabled edge kinds,
// hidden roles, hidden groups, and individually-hidden nodes/edges.
function currentGraph() {
  const activeNodes = nodes.filter(n =>
    !hiddenNodeIds.has(n.id) &&
    !hiddenRoles.has(n.role) &&
    !groupsOfNode(n.id).some(g => hiddenGroupNodes.has(g)));
  const activeIds = new Set(activeNodes.map(n => n.id));
  const activeLinks = links.filter(l =>
    enabledKinds.has(l.kind) && !hiddenEdgeKeys.has(edgeKey(l)) &&
    activeIds.has(l.from) && activeIds.has(l.to));
  return { activeNodes, activeLinks };
}

// gentle pull toward the (average, if in several) centroid of a node's groups,
// so bubbles self-segregate; no-ops entirely when "group bubbles" is unchecked.
function clusterForce(strength) {
  let nodesRef;
  function force(alpha) {
    if (!groupBubbles) return;
    const centroidOf = new Map();
    for (const [name, members] of groupMembership) {
      const memberNodes = nodesRef.filter(n => members.has(n.id));
      if (memberNodes.length) centroidOf.set(name, { x: d3.mean(memberNodes, d => d.x), y: d3.mean(memberNodes, d => d.y) });
    }
    for (const n of nodesRef) {
      const gs = groupsOfNode(n.id).filter(g => centroidOf.has(g));
      if (!gs.length) continue;
      const cx = d3.mean(gs, g => centroidOf.get(g).x);
      const cy = d3.mean(gs, g => centroidOf.get(g).y);
      n.vx += (cx - n.x) * strength * alpha;
      n.vy += (cy - n.y) * strength * alpha;
    }
  }
  force.initialize = n => nodesRef = n;
  return force;
}

let linkSel, nodeSel, hullSel, labelSel;

// Single entry point for any visibility/selection change: recomputes the
// active node/link sets, feeds them to the simulation (so hidden/filtered
// items drop out of physics too, not just the drawing), and redraws.
function render() {
  const { activeNodes, activeLinks } = currentGraph();

  sim.nodes(activeNodes);
  sim.force("link", d3.forceLink(activeLinks).id(d => d.id)
    .distance(restLength).strength(l => EDGE_STYLE[l.kind]?.strength ?? 0.4));

  const linkGroups = linkLayer.selectAll("g.linkgrp").data(activeLinks, edgeKey)
    .join(enter => {
      const g = enter.append("g").attr("class", "linkgrp");
      g.append("path").attr("class", "link-hit");
      g.append("path").attr("class", "link");
      return g;
    });
  linkSel = linkGroups.select(".link")
    .attr("stroke", l => EDGE_STYLE[l.kind].color)
    .attr("stroke-dasharray", l => EDGE_STYLE[l.kind].dash)
    .attr("stroke-width", l => l.kind === "calls" ? Math.min(4, 0.8 + Math.sqrt(l.weight ?? 1) * 0.5) : 1.3)
    .attr("stroke-opacity", l => l.kind === "calls" ? Math.min(0.85, 0.3 + (l.weight ?? 1) * 0.06) : 0.65)
    .attr("marker-end", l => EDGE_STYLE[l.kind].arrow ? `url(#arrow-${l.kind})` : null)
    .classed("selected", l => selected?.type === "edge" && selected.key === edgeKey(l));
  linkGroups.select(".link-hit")
    .on("click", (e, d) => { e.stopPropagation(); selectEdge(d); });

  nodeSel = nodeLayer.selectAll("g.node").data(activeNodes, n => n.id)
    .join(enter => {
      const g = enter.append("g").attr("class", "node");
      g.each(function (n) {
        const el = d3.select(this);
        if (n.kind === "scene") {
          el.append("rect").attr("x", -n.r).attr("y", -n.r)
            .attr("width", n.r * 2).attr("height", n.r * 2)
            .attr("transform", "rotate(45)").attr("rx", 2)
            .attr("fill", ROLE_META.scene.color).attr("fill-opacity", 0.85);
        } else if (n.kind === "interface") {
          el.append("circle").attr("r", n.r).attr("fill", "var(--bg)")
            .attr("stroke", ROLE_META.interface.color).attr("stroke-width", 2)
            .attr("stroke-dasharray", "4 3");
        } else {
          el.append("circle").attr("r", n.r)
            .attr("fill", ROLE_META[n.role]?.color ?? ROLE_META.plain.color).attr("fill-opacity", 0.92);
        }
        el.append("text").attr("dy", -n.r - 4).attr("text-anchor", "middle").text(n.label);
      });
      return g;
    })
    .classed("selected", n => selected?.type === "node" && selected.id === n.id)
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }))
    .on("mouseenter", (e, d) => { highlight(d); showTooltip(e, d); })
    .on("mousemove", e => moveTooltip(e))
    .on("mouseleave", () => { applySelectionHighlight(); tooltip.style.opacity = 0; })
    .on("click", (e, d) => { e.stopPropagation(); selectNode(d); });

  labelSel = nodeSel.select("text").style("display", showLabels ? null : "none");
  sim.alpha(0.6).restart();
  applySelectionHighlight();
  updateSelectionPanel();
  updateHiddenPanel();
  updateGroupPanel();
}

function tick() {
  linkLayer.selectAll("g.linkgrp path")
    .attr("d", l => `M${l.source.x},${l.source.y}L${edgeTip(l).x},${edgeTip(l).y}`);
  nodeSel.attr("transform", n => `translate(${n.x},${n.y})`);
  drawHulls();
}

// shorten line so arrowheads sit on the node rim
function edgeTip(l) {
  const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
  const dist = Math.hypot(dx, dy) || 1;
  const cut = EDGE_STYLE[l.kind].arrow ? l.target.r + 3 : 0;
  return { x: l.target.x - dx / dist * cut, y: l.target.y - dy / dist * cut };
}

const hullLine = d3.line().curve(d3.curveCatmullRomClosed);
function drawHulls() {
  if (!groupBubbles) { hullLayer.selectAll("*").remove(); return; }
  const activeNodes = sim.nodes();
  const shapes = [];
  for (const [name, members] of groupMembership) {
    if (hiddenGroupBubbles.has(name)) continue;
    const memberNodes = activeNodes.filter(n => members.has(n.id));
    if (memberNodes.length < 2) continue;
    const pts = memberNodes.flatMap(n => [
      [n.x - n.r, n.y], [n.x + n.r, n.y], [n.x, n.y - n.r], [n.x, n.y + n.r]]);
    const hull = d3.polygonHull(pts) ?? pts;
    shapes.push({ name, hull, top: d3.least(memberNodes, n => n.y - n.r) });
  }
  hullLayer.selectAll("path").data(shapes, s => s.name).join("path")
    .attr("class", "hull")
    .attr("d", s => hullLine(s.hull))
    .attr("fill", s => groupColor(s.name)).attr("fill-opacity", 0.07)
    .attr("stroke", s => groupColor(s.name)).attr("stroke-opacity", 0.12)
    .attr("stroke-width", 46);
  hullLayer.selectAll("text").data(shapes, s => s.name).join("text")
    .attr("class", "hull-label")
    .attr("x", s => d3.polygonCentroid(s.hull)[0])
    .attr("y", s => Math.min(...s.hull.map(p => p[1])) - 34)
    .attr("text-anchor", "middle")
    .text(s => s.name);
}

function highlight(d) {
  const near = adjacency.get(d.id);
  nodeSel.classed("dimmed", n => !near.has(n.id));
  linkSel.classed("dimmed", l => l.from !== d.id && l.to !== d.id);
}
function clearHighlight() {
  nodeSel.classed("dimmed", false);
  linkSel.classed("dimmed", false);
}
// Restores the "connected nodes" dimming for whatever is currently selected
// (or clears it if nothing is), so it stays active after the mouse leaves --
// not just while hovering.
function applySelectionHighlight() {
  if (selected?.type === "node") {
    const n = nodes.find(n => n.id === selected.id);
    if (n) { highlight(n); return; }
  }
  clearHighlight();
}

// ------------------------------------------------------------- selection/hide
function selectNode(d) {
  selected = (selected?.type === "node" && selected.id === d.id) ? null : { type: "node", id: d.id };
  render();
}
function selectEdge(d) {
  const key = edgeKey(d);
  selected = (selected?.type === "edge" && selected.key === key) ? null : { type: "edge", key };
  render();
}
function updateSelectionPanel() {
  const info = document.getElementById("selection-info");
  const hideBtn = document.getElementById("hide-selected");
  const addBtn = document.getElementById("add-to-group");
  const groupsDiv = d3.select("#selection-groups");

  if (!selected) {
    info.textContent = "click a node or edge to select it";
    hideBtn.disabled = true;
    addBtn.disabled = true;
    groupsDiv.selectAll("*").remove();
    return;
  }
  hideBtn.disabled = false;

  if (selected.type === "node") {
    const n = nodes.find(n => n.id === selected.id);
    info.textContent = `selected: ${n?.label ?? selected.id} (node)`;

    const chips = groupsDiv.selectAll("span.group-chip").data(groupsOfNode(selected.id), g => g);
    chips.exit().remove();
    const entered = chips.enter().append("span").attr("class", "group-chip");
    entered.append("span").attr("class", "chip-text");
    entered.append("span").attr("class", "chip-x").text("×")
      .on("click", (e, g) => {
        groupMembership.get(g)?.delete(selected.id);
        render();
      });
    groupsDiv.selectAll("span.group-chip").select(".chip-text").text(g => g);

    addBtn.disabled = !selectedGroup;
  } else {
    const l = links.find(l => edgeKey(l) === selected.key);
    info.textContent = l ? `selected: ${l.kind} edge` : "selected: edge";
    groupsDiv.selectAll("*").remove();
    addBtn.disabled = true;
  }
}
document.getElementById("hide-selected").addEventListener("click", () => {
  if (!selected) return;
  if (selected.type === "node") hiddenNodeIds.add(selected.id);
  else hiddenEdgeKeys.add(selected.key);
  selected = null;
  render();
});
document.getElementById("add-to-group").addEventListener("click", () => {
  if (!selected || selected.type !== "node" || !selectedGroup) return;
  if (!groupMembership.has(selectedGroup)) groupMembership.set(selectedGroup, new Set());
  groupMembership.get(selectedGroup).add(selected.id);
  render();
});
document.getElementById("restore-all").addEventListener("click", () => {
  hiddenNodeIds.clear();
  hiddenEdgeKeys.clear();
  render();
});
function updateHiddenPanel() {
  const rows = d3.select("#hidden-nodes").selectAll("div.hidden-row")
    .data(Array.from(hiddenNodeIds), id => id);
  rows.exit().remove();
  const entered = rows.enter().append("div").attr("class", "hidden-row");
  entered.append("span").attr("class", "restore-x").text("×")
    .on("click", (e, id) => { hiddenNodeIds.delete(id); render(); });
  entered.append("span").attr("class", "hidden-label");
  d3.select("#hidden-nodes").selectAll("div.hidden-row").select(".hidden-label")
    .text(id => nodes.find(n => n.id === id)?.label ?? id);

  document.getElementById("hidden-edges-count").textContent =
    hiddenEdgeKeys.size ? `${hiddenEdgeKeys.size} edge${hiddenEdgeKeys.size === 1 ? "" : "s"} hidden` : "";
  document.getElementById("restore-all").disabled = hiddenNodeIds.size === 0 && hiddenEdgeKeys.size === 0;
}

// --------------------------------------------------------------------- groups
function updateGroupPanel() {
  const names = Array.from(groupMembership.keys()).sort();
  const rows = d3.select("#group-list").selectAll("div.group-row").data(names, name => name);
  rows.exit().remove();
  const entered = rows.enter().append("div").attr("class", "group-row");
  entered.append("input").attr("type", "checkbox").attr("class", "grp-bubble-cb")
    .on("change", function (e, name) {
      this.checked ? hiddenGroupBubbles.delete(name) : hiddenGroupBubbles.add(name);
      drawHulls();
    });
  entered.append("input").attr("type", "checkbox").attr("class", "grp-nodes-cb")
    .on("change", function (e, name) {
      this.checked ? hiddenGroupNodes.delete(name) : hiddenGroupNodes.add(name);
      render();
    });
  entered.append("span").attr("class", "group-name")
    .on("click", (e, name) => {
      selectedGroup = selectedGroup === name ? null : name;
      updateGroupPanel();
      updateSelectionPanel();
    })
    .on("dblclick", (e, name) => renameGroup(name));
  entered.append("span").attr("class", "group-del").text("×")
    .on("click", (e, name) => deleteGroup(name));

  const merged = d3.select("#group-list").selectAll("div.group-row");
  merged.select(".grp-bubble-cb").property("checked", name => !hiddenGroupBubbles.has(name));
  merged.select(".grp-nodes-cb").property("checked", name => !hiddenGroupNodes.has(name));
  merged.select(".group-name")
    .text(name => `${name} (${groupMembership.get(name).size})`)
    .style("color", name => groupColor(name))
    .classed("group-name-selected", name => selectedGroup === name);
}

function renameGroup(oldName) {
  const next = prompt(`Rename group "${oldName}" to:`, oldName);
  if (next === null) return;
  const trimmed = next.trim();
  if (!trimmed || trimmed === oldName) return;

  const members = groupMembership.get(oldName) ?? new Set();
  groupMembership.delete(oldName);
  if (groupMembership.has(trimmed)) {
    for (const id of members) groupMembership.get(trimmed).add(id);
  } else {
    groupMembership.set(trimmed, members);
  }
  if (hiddenGroupBubbles.delete(oldName)) hiddenGroupBubbles.add(trimmed);
  if (hiddenGroupNodes.delete(oldName)) hiddenGroupNodes.add(trimmed);
  if (selectedGroup === oldName) selectedGroup = trimmed;
  render();
}

function deleteGroup(name) {
  groupMembership.delete(name);
  hiddenGroupBubbles.delete(name);
  hiddenGroupNodes.delete(name);
  if (selectedGroup === name) selectedGroup = null;
  render();
}

document.getElementById("new-group-btn").addEventListener("click", createGroupFromInput);
document.getElementById("new-group-name").addEventListener("keydown", e => {
  if (e.key === "Enter") createGroupFromInput();
});
function createGroupFromInput() {
  const input = document.getElementById("new-group-name");
  const name = input.value.trim();
  if (!name || groupMembership.has(name)) return;
  groupMembership.set(name, new Set());
  input.value = "";
  updateGroupPanel();
}

document.getElementById("export-groups").addEventListener("click", () => {
  const groups = {};
  for (const n of nodes) {
    const gs = groupsOfNode(n.id);
    if (gs.length) groups[n.id] = gs;
  }
  const blob = new Blob([JSON.stringify({ groups }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "codegraph.config.groups.json";
  a.click();
  URL.revokeObjectURL(url);
});

function showTooltip(e, d) {
  const sigs = [];
  if (d.signalsDeclared?.length) sigs.push(`declares: ${d.signalsDeclared.join(", ")}`);
  if (d.signalsEmitted?.length) sigs.push(`emits: ${d.signalsEmitted.join(", ")}`);
  const groupText = (d.groups?.length ? d.groups : groupsOfNode(d.id)).join(", ") || "(none)";
  tooltip.innerHTML =
    `<div class="t-name">${d.label}</div>` +
    (d.file ? `<div class="t-file">${d.file}</div>` : "") +
    `<div class="t-meta">${d.kind} · ${d.role} · ${groupText}` +
    (d.loc ? ` · ${d.loc} loc` : "") + (d.baseType ? ` · : ${d.baseType}` : "") + `</div>` +
    sigs.map(s => `<div class="t-sig">${s}</div>`).join("") +
    (d.scenes?.length ? `<div class="t-meta">in: ${d.scenes.join(", ")}</div>` : "");
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function showDescTooltip(e, title, desc) {
  tooltip.innerHTML = `<div class="t-name">${title}</div><div class="t-meta t-desc">${desc}</div>`;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + "px";
  tooltip.style.top = (e.clientY + 14) + "px";
}

function updateStats(data) {
  document.getElementById("stats").textContent =
    `${data.nodes.length} nodes · ${data.edges.length} edges` +
    (data.meta?.generatedAt ? ` · ${data.meta.generatedAt.slice(0, 10)}` : "");
}

// ------------------------------------------------------------------ controls
let groupBubbles = true, showLabels = true;

const edgeToggles = d3.select("#edge-toggles");
for (const [kind, s] of Object.entries(EDGE_STYLE)) {
  const row = edgeToggles.append("label").attr("class", "row");
  row.append("input").attr("type", "checkbox").property("checked", true)
    .on("change", function () {
      this.checked ? enabledKinds.add(kind) : enabledKinds.delete(kind);
      render();
    });
  row.append("svg").attr("class", "edgekey").attr("height", 6)
    .append("line").attr("x1", 0).attr("x2", 22).attr("y1", 3).attr("y2", 3)
    .attr("stroke", s.color).attr("stroke-width", 2).attr("stroke-dasharray", s.dash);
  row.append("span").text(kind);
  row.on("mouseenter", e => showDescTooltip(e, kind, s.desc))
    .on("mousemove", moveTooltip)
    .on("mouseleave", () => tooltip.style.opacity = 0);
}
const roleLegend = d3.select("#role-legend");
for (const [role, meta] of Object.entries(ROLE_META)) {
  const row = roleLegend.append("label").attr("class", "row");
  row.append("input").attr("type", "checkbox").property("checked", true)
    .on("change", function () {
      this.checked ? hiddenRoles.delete(role) : hiddenRoles.add(role);
      render();
    });
  row.append("span").attr("class", "swatch").style("background", meta.color);
  row.append("span").text(role);
  row.on("mouseenter", e => showDescTooltip(e, role, meta.desc))
    .on("mousemove", moveTooltip)
    .on("mouseleave", () => tooltip.style.opacity = 0);
}

d3.select("#charge").on("input", function () {
  chargeScale = +this.value;
  document.getElementById("charge-val").textContent = chargeScale.toFixed(2);
  sim?.force("charge", d3.forceManyBody().strength(d => -(40 + d.r * 9) * chargeScale));
  sim?.alpha(0.4).restart();
});
d3.select("#spring").on("input", function () {
  springScale = +this.value;
  document.getElementById("spring-val").textContent = springScale.toFixed(2);
  sim?.force("link").distance(restLength);
  sim?.alpha(0.4).restart();
});
d3.select("#hulls").on("change", function () {
  groupBubbles = this.checked;
  sim?.alpha(0.4).restart();
  drawHulls();
});
d3.select("#labels").on("change", function () {
  showLabels = this.checked; labelSel?.style("display", showLabels ? null : "none");
});

// ------------------------------------------------------------------ data load
document.querySelector("#loadfile input").addEventListener("change", e => loadFile(e.target.files[0]));
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
function loadFile(file) {
  if (!file) return;
  file.text().then(t => { sim?.stop(); build(JSON.parse(t)); });
}

fetch("graph.json")
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(build)
  .catch(() => build(SAMPLE));
